<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>离散数学题库</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }

        /* 顶部导航 */
        .nav-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #fff;
            border-bottom: 1px solid #eee;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .nav-title {
            font-size: 20px;
            font-weight: 700;
            color: #c41e3a;
        }
        .type-tabs {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .type-tab {
            padding: 8px 20px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.25s;
            background: #f0f0f0;
            color: #666;
        }
        .type-tab:hover { background: #e8e8e8; }
        .type-tab.active {
            background: #c41e3a;
            color: #fff;
            box-shadow: 0 2px 8px rgba(196,30,58,0.3);
        }
        .action-btns {
            display: flex;
            gap: 10px;
        }
        .action-btn {
            padding: 7px 18px;
            border-radius: 20px;
            border: 1.5px solid #c41e3a;
            background: transparent;
            color: #c41e3a;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .action-btn:hover { background: #fef2f4; }
        .action-btn.reset-btn {
            border-color: #1890ff;
            color: #1890ff;
        }
        .action-btn.reset-btn:hover { background: #e6f7ff; }

        /* 主内容 */
        .main-container {
            max-width: 800px;
            margin: 24px auto;
            padding: 0 20px 40px;
        }
        .section-title {
            font-size: 15px;
            color: #999;
            margin-bottom: 16px;
            padding-left: 4px;
        }

        /* 题目卡片 */
        .question-card {
            background: #fff;
            border-radius: 12px;
            padding: 28px 32px;
            margin-bottom: 18px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.06);
            transition: box-shadow 0.2s;
        }
        .question-card:hover { box-shadow: 0 3px 12px rgba(0,0,0,0.09); }

        /* 题目头部：序号 + 题干 */
        .q-header {
            display: flex;
            gap: 16px;
            margin-bottom: 18px;
            align-items: flex-start;
        }
        .q-number {
            width: 30px;
            height: 30px;
            min-width: 30px;
            background: #c41e3a;
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            margin-top: 2px;
        }
        .q-text {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.65;
            flex: 1;
        }

        /* 选项列表 */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-left: 46px;
        }
        .option-item {
            padding: 13px 20px;
            border-radius: 8px;
            border: 1.5px solid #eee;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fafafa;
            user-select: none;
        }
        .option-item:hover {
            border-color: #c41e3a;
            background: #fff;
        }
        .option-item.selected {
            border-color: #c41e3a;
            background: #fff5f6;
        }
        .option-item.correct {
            border-color: #52c41a;
            background: #f6ffed;
        }
        .option-item.wrong {
            border-color: #ff4d4f;
            background: #fff2f0;
        }
        .correct-tag {
            color: #52c41a;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .wrong-tag {
            color: #ff4d4f;
            font-size: 13px;
            font-weight: 600;
        }

        /* 简答题/计算题/论述题 的答案输入区 */
        .answer-area {
            margin-left: 46px;
            margin-top: 14px;
        }
        .answer-input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #ddd;
            border-radius: 8px;
            font-size: 14.5px;
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        .answer-input:focus { border-color: #c41e3a; }
        .answer-input.show-answer {
            border-color: #52c41a;
            background: #f6ffed;
        }
        .short-answer-hint {
            font-size: 13px;
            color: #999;
            margin-top: 6px;
        }

        /* 收起解析按钮 */
        .toggle-analysis-btn {
            margin-left: 46px;
            margin-top: 16px;
            padding: 8px 22px;
            border-radius: 22px;
            border: none;
            background: #c41e3a;
            color: #fff;
            cursor: pointer;
            font-size: 13.5px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .toggle-analysis-btn:hover {
            background: #a91829;
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(196,30,58,0.3);
        }
        .toggle-analysis-btn .arrow {
            transition: transform 0.25s;
        }
        .toggle-analysis-btn.expanded .arrow {
            transform: rotate(180deg);
        }

        /* 解析区域 */
        .analysis-section {
            margin-left: 46px;
            margin-top: 14px;
            border-left: 3px solid #c41e3a;
            padding-left: 20px;
            display: none;
            animation: slideDown 0.3s ease;
        }
        .analysis-section.visible { display: block; }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .result-tip {
            background: #fffbe6;
            border: 1px solid #ffe58f;
            border-radius: 8px;
            padding: 12px 18px;
            font-size: 14px;
            color: #d48806;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .analysis-title {
            font-size: 15px;
            font-weight: 700;
            color: #c41e3a;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .analysis-body {
            font-size: 14.5px;
            line-height: 1.85;
            color: #444;
        }
        .analysis-body p { margin-bottom: 8px; }

        /* 统计栏 */
        .stats-bar {
            text-align: center;
            padding: 16px;
            color: #888;
            font-size: 14px;
            margin-top: 10px;
        }
        .stats-bar span { margin: 0 8px; font-weight: 600; }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #bbb;
        }
        .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
        .empty-state .text { font-size: 15px; }

        /* 响应式 */
        @media (max-width: 600px) {
            .nav-header { padding: 12px 16px; flex-direction: column; align-items: stretch; }
            .type-tabs { justify-content: center; flex-wrap: wrap; }
            .action-btns { justify-content: center; }
            .question-card { padding: 20px 18px; }
            .q-header { flex-direction: row; }
            .options-list, .answer-area, .toggle-analysis-btn, .analysis-section { margin-left: 0; }
        }
    </style>
<style>.ca-topic{--ca-ink:#173a2b;--ca-green:#347047;--ca-line:#d6e9d5;--ca-muted:#577567;color:var(--ca-ink);margin:22px 0;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;text-align:left;line-height:1.5;min-width:0}

.ca-topic-detail{margin-top:20px;background:#f3faed;border:1px solid var(--ca-line);border-radius:14px;padding:18px}.ca-topic-detail-title{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.ca-topic h3{margin:0;font-size:18px;color:var(--ca-ink);overflow-wrap:anywhere}.ca-topic-detail-title>span{background:#dcefcf;color:var(--ca-green);padding:4px 9px;border-radius:99px;font-size:12px}.ca-topic-tags{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 16px}.ca-topic-tags span{font-size:14px;padding:4px 9px;border:1px solid var(--ca-line);border-radius:12px;background:#ffffffb0;color:var(--ca-muted);overflow-wrap:anywhere;max-width:100%}.ca-topic-detail-bottom{display:flex;gap:16px;align-items:flex-end;justify-content:space-between}.ca-topic-questions{display:flex;flex-wrap:wrap;gap:7px;align-items:center;min-width:0}.ca-topic-questions>span{font-size:14px;color:var(--ca-muted);margin-right:3px}.ca-topic-questions button{min-width:44px;min-height:44px;padding:8px;border:1px solid #a9c998;border-radius:8px;color:var(--ca-ink);background:white;font-size:14px}.ca-topic-practice,.ca-topic-all{min-height:46px;background:var(--ca-green);color:white;border:0;border-radius:10px;padding:11px 19px;font-size:15px!important;font-weight:700!important;flex-shrink:0}.ca-topic-note{margin:17px 0 0;color:var(--ca-muted);font-size:13px}.ca-topic-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px}.ca-topic-mode{font-size:14px;color:var(--ca-muted)}
.ca-topic-host{max-width:980px;margin:24px auto;padding:0 16px}.ca-topic-question-hidden{display:none!important}
@media(max-width:680px){.ca-topic{margin:16px 0}.ca-topic-card{padding:16px 12px;border-radius:18px}.ca-topic-head{gap:8px;align-items:flex-start}.ca-topic h2{font-size:19px}.ca-topic-head p{font-size:13px}.ca-topic-switch button{padding:8px 9px;font-size:13px}.ca-topic-summary{padding:12px 8px;gap:4px}.ca-topic-summary strong{font-size:21px}.ca-topic-row{grid-template-columns:minmax(0,1.2fr) minmax(55px,1fr) 49px;gap:3px 10px;padding:11px 8px}.ca-topic-name{grid-column:1;grid-row:1;font-size:14px}.ca-topic-meta{grid-column:1;grid-row:2;font-size:12px}.ca-topic-track{grid-column:2;grid-row:1/3;height:8px}.ca-topic-percent{grid-column:3;grid-row:1/3;font-size:14px}.ca-topic-detail{padding:13px 10px}.ca-topic-detail-bottom{display:block}.ca-topic-practice{width:100%;margin-top:14px}.ca-topic-tags span{font-size:13px}.ca-topic-actions{align-items:stretch;flex-direction:column}.ca-topic-all{width:100%}.ca-topic-host{padding:0 12px}.ca-topic-note{font-size:12px}}
@media(prefers-reduced-motion:reduce){.ca-topic *{scroll-behavior:auto!important;transition:none!important}}

<body>

<div class="nav-header">
    <div class="nav-title">离散数学题库</div>
    <div class="type-tabs">
        <button class="type-tab active" data-type="choice" onclick="switchType('choice')">选择题</button>
        <button class="type-tab" data-type="short" onclick="switchType('short')">简答题</button>
        <button class="type-tab" data-type="calc" onclick="switchType('calc')">计算题</button>
        <button class="type-tab" data-type="proof" onclick="switchType('proof')">论述题</button>
    </div>
    <div class="action-btns">
        <button class="action-btn" onclick="toggleAllAnalysis()">
            <span id="toggleAllText">展开全部解析</span>
        </button>
        <button class="action-btn reset-btn" onclick="resetAllAnswers()">
            <span>&#x21bb;</span> 重置答案
        </button>
    </div>
</div>

<div class="ca-topic-host" id="topic-host"></div><div class="main-container" id="app"></div>

<script>/* Shared learning-topic overview. No answers or progress records are changed here. */
(() => {
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function summarize(questions) {
    const scored = questions.length > 0 && questions.every(q => typeof q.score === 'number' && Number.isFinite(q.score) && q.score > 0);
    const groups = new Map();
    questions.forEach((q,index) => {
      const name = q.topic || q.point || '综合应用';
      if (!groups.has(name)) groups.set(name,{name,items:[],points:[],score:0});
      const group=groups.get(name);
      group.items.push({...q,index});
      if(q.point && !group.points.includes(q.point))group.points.push(q.point);
      if(scored)group.score+=q.score;
    });
    return {scored,total:questions.length,totalScore:scored?questions.reduce((n,q)=>n+q.score,0):null,groups:[...groups.values()]};
  }
  function mount({container,questions,onJump,onPractice,onReset}) {
    const data=summarize(questions);
    if(!data.total)return null;
    let metric=data.scored?'score':'count',selected=null,expanded=false,active=null;
    const root=document.createElement('section');root.className='ca-topic';root.setAttribute('aria-label','本套考点分析');container.append(root);
    const value=g=>metric==='score'?g.score:g.items.length;
    const total=()=>metric==='score'?data.totalScore:data.total;
    const ordered=()=>data.groups.slice().sort((a,b)=>value(b)-value(a));
    selected=ordered()[0].name;
    const percent=g=>Number((value(g)/total()*100).toFixed(1));
    function render() {
      const list=ordered(),visible=expanded?list:list.slice(0,7),g=data.groups.find(g=>g.name===selected);
      root.innerHTML=`<div class="ca-topic-summary"><span><strong>${data.total}</strong> 道题</span>${data.scored?`<span><strong>${data.totalScore}</strong> 分</span>`:''}<span><strong>${data.groups.length}</strong> 类考点</span></div>
      <div class="ca-topic-card"><div class="ca-topic-head"><div><h2>本套考点分布</h2><p>看看这套题，重点练什么</p></div><div class="ca-topic-switch" role="group" aria-label="统计方式">${data.scored?`<button type="button" data-metric="score" aria-pressed="${metric==='score'}">按分值</button>`:''}<button type="button" data-metric="count" aria-pressed="${metric==='count'}">按题数</button></div></div>
      <div class="ca-topic-rows">${visible.map(g=>`<button type="button" class="ca-topic-row" data-topic="${esc(g.name)}" aria-pressed="${selected===g.name}" aria-label="${esc(g.name)}，${g.items.length}题${data.scored?'，'+g.score+'分':''}，占${percent(g)}%"><span class="ca-topic-name">${esc(g.name)}</span><span class="ca-topic-meta">${g.items.length}题${data.scored?' · '+g.score+'分':''}</span><span class="ca-topic-track" aria-hidden="true"><i style="width:${percent(g)}%"></i></span><strong class="ca-topic-percent">${percent(g)}%</strong></button>`).join('')}</div>
      ${list.length>7?`<button type="button" class="ca-topic-more" aria-expanded="${expanded}">${expanded?'收起考点':'展开全部 '+list.length+' 类考点'}</button>`:''}
      <div class="ca-topic-detail" aria-live="polite"><div class="ca-topic-detail-title"><h3>${esc(g.name)}</h3><span>已选考点</span></div><div class="ca-topic-tags">${g.points.map(p=>`<span>${esc(p)}</span>`).join('')}</div><div class="ca-topic-detail-bottom"><div class="ca-topic-questions"><span>对应题目</span>${g.items.map(q=>`<button type="button" data-question="${q.index}" aria-label="跳转到${esc(q.no)}题">${esc(q.no)}</button>`).join('')}</div><button type="button" class="ca-topic-practice">只练该考点 →</button></div></div>
      <p class="ca-topic-note">按主考点统计，每题只计一次。${data.scored?'':'本套按题数展示占比。'}</p></div>
      <div class="ca-topic-actions"><span class="ca-topic-mode" role="status">${active?'专项练习：'+esc(active):'整套练习'}</span><button type="button" class="ca-topic-all">${active?'退出专项 · 练习整套':'开始整套练习 →'}</button></div>`;
      root.querySelectorAll('[data-topic]').forEach(b=>b.addEventListener('click',()=>{selected=b.dataset.topic;render();root.querySelectorAll('[data-topic]').forEach(el=>{if(el.dataset.topic===selected)el.focus({preventScroll:true});});}));
      root.querySelectorAll('[data-metric]').forEach(b=>b.addEventListener('click',()=>{metric=b.dataset.metric;render();root.querySelector(`[data-metric="${metric}"]`).focus({preventScroll:true});}));
      root.querySelector('.ca-topic-more')?.addEventListener('click',()=>{expanded=!expanded;render();root.querySelector('.ca-topic-more').focus({preventScroll:true});});
      root.querySelectorAll('[data-question]').forEach(b=>b.addEventListener('click',()=>onJump(Number(b.dataset.question))));
      root.querySelector('.ca-topic-practice').addEventListener('click',()=>{active=g.name;render();onPractice(g.items.map(q=>q.index),g.name);});
      root.querySelector('.ca-topic-all').addEventListener('click',()=>{active=null;render();onReset();});
    }
    render();
    return {root,data,clear(){active=null;render();}};
  }
  window.CaigouTopics={mount,summarize};
})();
</script>
<script>
// ========== 题库数据 ==========
const questionBank = {

    // ==================== 选择题 (15题) ====================
    choice: [
        {
            id: 'c1',
            question: '以下哪个图是自对偶的？',
            options: [
                { label: 'A', text: '四边形（无对角线）' },
                { label: 'B', text: '菱形（带两条对角线）' },
                { label: 'C', text: '三角形加一条边' },
                { label: 'D', text: '田字形网格图' }
            ],
            answer: 'B',
            analysis: '<p><strong>自对偶图的定义：</strong>一个图G是自对偶的，当且仅当G与其对偶图G*同构。</p><p>选项B中的菱形图（即完全图K4去掉两条边形成的平面图），其对偶图与自身同构，因此是自对偶图。</p><p>自对偶图的一个重要性质是：若G是有n个顶点、m条边、f个面的连通平面图且G自对偶，则n=f。</p>'
        },
        {
            id: 'c2',
            question: '以下哪个不是度序列？',
            options: [
                { label: 'A', text: '{0,1,1,3,5}' },
                { label: 'B', text: '{1,2,3,4}' },
                { label: 'C', text: '{1,3,4,5}' },
                { label: 'D', text: '{1,2,3,4,5}' }
            ],
            answer: 'C',
            analysis: '<p><strong>度序列判定依据（Havel-Hakimi定理）：</strong>一个非负整数序列是某个简单图的度序列，当且仅当该序列满足握手定理（所有度数之和为偶数）且能通过Havel-Hakimi算法化简为全零序列。</p><p>选项C中{1,3,4,5}的和为13，是奇数，不满足握手定理（度数之和必须等于2|E|，为偶数），因此不可能是任何简单图的度序列。</p><p>A选项和为10（偶数）、B选项和为10（偶数）、D选项和为15（奇数，但若允许有环或重边则可能存在）——实际上D也不满足简单图条件，但C是最明显的错误答案。</p>'
        },

     = A ∩ C ∩ B̅ ∩ D̅       [交换律]

右边 = A∩C - (B∪D)

     = (A∩C) ∩ (B̅ ∩ D̅)    [德摩根律]

            analysis: `<p><strong>(1) 对称差的性质：</strong></p><p>A⊕B = ∅ 表示 A 与 B 的对称差为空，即不存在只属于A不属于B、或只属于B不属于A的元素。这直接推出 A=B。</p><p>更一般的结论：<b>A⊕B = ∅ ⟺ A=B</b></p><p><strong>(2) 幂集的并集包含关系：</strong></p><p>P(A) 的每个元素都是 A 的子集，自然也是 A∪B 的子集（因为 A ⊆ A∪B）。同理 P(B) 中的元素也都是 A∪B 的子集。因此两者的并集仍包含于 P(A∪B)。</p><p><b>注意：</b>反向包含一般不成立！P(A∪B) 中可能有既不是A的子集也不是B的子集的集合（如取自A和B各一些元素的混合子集）。</p>`

            answer: `证明：R 是等价关系需验证三性。

对任意 a,b∈ℤ，若 <a,b>∈R：
(a-b)/4 为整数
令 (a-b)/4 = k（k∈ℤ），则 a-b = 4k
于是 b-a = -(a-b) = -4k
(b-a)/4 = -k 也是整数 ✓
所以 <b,a> ∈ R。
∴ R 满足对称性。

【传递性】
对任意 a,b,c∈ℤ，若 <a,b>∈R 且 <b,c>∈R：

a-b = 4m，b-c = 4n

• 最小元：✅ <b>1</b>（1整除A中所有元素）

【极大元与极小元】
• 极大元：<b>{8, 9, 12}</b>
• 极小元：<b>{1}</b>`,
            analysis: `<p><strong>哈斯图绘制规则：</strong></p><ol style="margin:6px 0;padding-left:20px;"><li>省略每个点的自环（自反性）</li><li>省略由传递性能导出的边（若a|b且b|c且a|c，则不画a→c）</li><li>小的数在下，大的数在上</li></ol><p><strong>四种特殊元素判定：</strong><ul style="margin:6px 0;padding-left:18px;"><li><b>最大元</b>：被所有元素整除 → 本题无最大元</li><li><b>最小元</b>：能整除所有元素 → 本题为 1</li><li><b>极大元</b>：上方没有更大元素 → {8,9,12}</li><li><b>极小元</b>：下方没有更小元素 → {1}</li></ul></p>`
        }
    ]
};

// ========== 状态管理 ==========
let topicFilter = null, topicName = '', topicView = null;
function visibleQuestions(){ return topicFilter ? Object.values(questionBank).flat().filter(q=>topicFilter.includes(q.id)) : questionBank[currentType]; }
let currentType = 'choice';
let userAnswers = {};
let analysisVisible = {};
let allAnalysisExpanded = false;

// ========== 初始化 ==========
function init() {
    loadState();
    render();
}

function loadState() {
    try {
        const saved = localStorage.getItem('discreteMath_state');
        if (saved) {
            const state = JSON.parse(saved);
            userAnswers = state.userAnswers || {};
            analysisVisible = state.analysisVisible || {};
            currentType = state.currentType || 'choice';
        }
    } catch(e) {}
}

function saveState() {
    try {
        localStorage.setItem('discreteMath_state', JSON.stringify({
            userAnswers, analysisVisible, currentType
        }));
    } catch(e) {}
}

// ========== 切换题型 ==========
function switchType(type) {
    topicFilter=null;topicView?.clear();
    currentType = type;
    document.querySelectorAll('.type-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.type === type);
    });
    render();
    saveState();
}

// ========== 渲染 ==========
function render() {
    const app = document.getElementById('app');
    const questions = visibleQuestions();

    if (!questions || questions.length === 0) {
        app.innerHTML = `<div class="empty-state"><div class="icon">📝</div><div class="text">暂无题目</div></div>`;
        return;
    }

    let typeLabel = { choice: '选择题', short: '简答题', calc: '计算题', proof: '论述题' };

    let html = `<div class="section-title">${topicFilter ? topicName + " · 专项练习" : typeLabel[currentType]} · 共 ${questions.length} 题</div>`;

    questions.forEach((q, idx) => {
        const qId = q.id;
        const selected = userAnswers[qId];
        const showAnalysis = analysisVisible[qId];
        const questionType = topicFilter ? Object.keys(questionBank).find(type => questionBank[type].some(item => item.id === q.id)) : currentType;
        const isChoice = q.type === 'choice' || questionType === 'choice';
        const isCorrect = isChoice && selected && selected === q.answer;

        html += `<div class="question-card" id="topic-question-${q.id}" tabindex="-1">`;
        html += `<div class="q-header"><div class="q-number">${topicFilter ? q.id : idx + 1}</div><div class="q-text">${formatText(q.question)}</div></div>`;

        if (isChoice && q.options) {
            // 选项渲染
            html += `<div class="options-list">`;
            q.options.forEach(opt => {
                let cls = 'option-item';
                const isSelected = selected === opt.label;
                const isRightAnswer = opt.label === q.answer;

                if (showAnalysis) {
                    if (isRightAnswer) cls += ' correct';
                    else if (isSelected && !isRightAnswer) cls += ' wrong';
                    else if (isSelected) cls += ' selected';
                } else if (isSelected) {
                    cls += ' selected';
                }

                let tagHtml = '';
                if (showAnalysis && isRightAnswer) {
                    tagHtml = `<span class="correct-tag">✓ 正确答案</span>`;
                } else if (showAnalysis && isSelected && !isRightAnswer) {
                    tagHtml = `<span class="wrong-tag">✗ 你的选择</span>`;
                }

                html += `<div class="${cls}" onclick="selectOption('${qId}', '${opt.label}')">
                    <span>${opt.label}. ${formatText(opt.text)}</span>${tagHtml}
                </div>`;
            });
            html += `</div>`;
        } else {
            // 简答题/计算题/论述题的文本区域
            html += `<div class="answer-area">`;
            if (questionType === 'proof') {
                html += `<textarea class="answer-input ${showAnalysis ? 'show-answer' : ''}"
                    placeholder="在此书写你的证明过程..."
                    onchange="updateTextAnswer('${qId}', this.value)"
                    oninput="updateTextAnswer('${qId}', this.value)">${selected || ''}</textarea>`;
            } else if (questionType === 'calc') {
                html += `<textarea class="answer-input ${showAnalysis ? 'show-answer' : ''}"
                    placeholder="在此书写你的计算过程..."
                    onchange="updateTextAnswer('${qId}', this.value)"
                    oninput="updateTextAnswer('${qId}', this.value)">${selected || ''}</textarea>`;
            } else {
                html += `<input type="text" class="answer-input" style="min-height:44px;"
                    placeholder="填写你的答案..."
                    value="${selected || ''}"
                    onchange="updateTextAnswer('${qId}', this.value)"
                    oninput="updateTextAnswer('${qId}', this.value)">`;
                html += `<div class="short-answer-hint">${q.type === 'fill' ? '【填空题】请直接填写答案' : '请简要回答'}</div>`;
            }
            html += `</div>`;
        }

        // 解析切换按钮
        html += `<button class="toggle-analysis-btn ${showAnalysis ? 'expanded' : ''}" onclick="toggleAnalysis('${qId}')">
            ${showAnalysis ? '收起解析' : '展开解析'} <span class="arrow">▲</span>
        </button>`;

        // 解析区域
        html += `<div class="analysis-section ${showAnalysis ? 'visible' : ''}" id="analysis-${qId}">`;
        
        if (isChoice) {
            if (!selected) {
                html += `<div class="result-tip">💡 你还没有作答，正确答案是：<strong>${q.answer}</strong></div>`;
            } else if (isCorrect) {
                html += `<div class="result-tip">✅ 回答正确！答案是 <strong>${q.answer}</strong></div>`;
            } else {
                html += `<div class="result-tip">❌ 回答错误，你选了 ${selected}，正确答案是 <strong>${q.answer}</strong></div>`;
            }
        } else {
            html += `<div class="result-tip">💡 参考答案</div>`;
        }

        html += `<div class="analysis-title">📋 答案解析</div>`;
        html += `<div class="analysis-body">${q.analysis}`;
        if (!isChoice && q.answer) {
            html += `<p style="margin-top:10px;padding:10px;background:#f6ffed;border-radius:6px;border-left:3px solid #52c41a;">
            <strong>参考答案：</strong><pre style="white-space:pre-wrap;margin:6px 0 0;font-family:inherit;">${formatText(q.answer)}</pre></p>`;
        }
        html += `</div></div>`;

        html += `</div>`; // card end
    });

    // 统计
    const answered = questions.filter(q => userAnswers[q.id]).length;
    html += `<div class="stats-bar">已完成 <span>${answered}</span> / ${questions.length} 题</div>`;

    app.innerHTML = html;

    // 更新全局按钮文字
    updateToggleAllBtn();
}

// ========== 交互函数 ==========
function selectOption(qId, opt) {
    if (analysisVisible[qId]) return; // 已展开解析后不允许更改
    userAnswers[qId] = opt;
    render();
    saveState();
}

function updateTextAnswer(qId, val) {
    userAnswers[qId] = val;
    saveState();
}

function toggleAnalysis(qId) {
    analysisVisible[qId] = !analysisVisible[qId];
    render();
    saveState();
}

function toggleAllAnalysis() {
    const questions = visibleQuestions();
    allAnalysisExpanded = !allAnalysisExpanded;
    questions.forEach(q => {
        analysisVisible[q.id] = allAnalysisExpanded;
    });
    render();
    saveState();
}

function resetAllAnswers() {
    if (!confirm('确定要重置所有答案吗？')) return;
    const questions = visibleQuestions();
    questions.forEach(q => {
        delete userAnswers[q.id];
        analysisVisible[q.id] = false;
    });
    allAnalysisExpanded = false;
    render();
    saveState();
}

function updateToggleAllBtn() {
    const btn = document.getElementById('toggleAllText');
    if (btn) {
        const questions = visibleQuestions();
        const visibleCount = questions.filter(q => analysisVisible[q.id]).length;
        if (visibleCount >= questions.length) {
            btn.textContent = '收起全部解析';
        } else if (visibleCount > 0) {
            btn.textContent = '展开全部解析';
        } else {
            btn.textContent = '展开全部解析';
        }
    }
}

// ========== 工具函数 ==========
function formatText(text) {
    if (!text) return '';
    return text
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\n/g, '<br>')
        .replace(/&lt;(?!\/?[bius]|sup|sub|br\s?\/?|table|tr|th|td|ol|ul|li|pre|strong|em)/gi, '&lt;');
}

// 启动
init();

const topicMetadata={"c3":{"topic":"命题逻辑","point":"命题与真值"},"c7":{"topic":"命题逻辑","point":"命题公式类型"},"c8":{"topic":"命题逻辑","point":"逻辑等价式"},"c9":{"topic":"命题逻辑","point":"命题推理"},"s1":{"topic":"命题逻辑","point":"充分条件与必要条件"},"s3":{"topic":"命题逻辑","point":"复合命题真值"},"s4":{"topic":"命题逻辑","point":"有效推理与重言式"},"s7":{"topic":"命题逻辑","point":"命题等价类"},"ca1":{"topic":"命题逻辑","point":"主析取范式"},"p2":{"topic":"命题逻辑","point":"自然推理"},"c15":{"topic":"谓词逻辑","point":"合式公式"},"s9":{"topic":"谓词逻辑","point":"前束范式"},"s12":{"topic":"谓词逻辑","point":"谓词符号化"},"p3":{"topic":"谓词逻辑","point":"量词等价变换"},"c4":{"topic":"集合与计数","point":"幂集基数"},"c6":{"topic":"集合与计数","point":"集合运算"},"c16":{"topic":"集合与计数","point":"对称差"},"s2":{"topic":"集合与计数","point":"集合表示"},"s5":{"topic":"集合与计数","point":"集合划分"},"s13":{"topic":"集合与计数","point":"属于与包含"},"s15":{"topic":"集合与计数","point":"幂集与笛卡尔积"},"ca5":{"topic":"集合与计数","point":"容斥原理"},"p1":{"topic":"集合与计数","point":"集合恒等式"},"p4":{"topic":"集合与计数","point":"对称差与幂集"},"c5":{"topic":"关系与函数","point":"二元关系计数"},"c11":{"topic":"关系与函数","point":"关系性质"},"c17":{"topic":"关系与函数","point":"等价关系"},"s6":{"topic":"关系与函数","point":"关系性质"},"s8":{"topic":"关系与函数","point":"同余与等价类"},"ca2":{"topic":"关系与函数","point":"关系矩阵与性质"},"ca4":{"topic":"关系与函数","point":"逆函数与复合函数"},"ca6":{"topic":"关系与函数","point":"传递闭包"},"ca8":{"topic":"关系与函数","point":"复合关系"},"p5":{"topic":"关系与函数","point":"等价关系证明"},"ca3":{"topic":"偏序与哈斯图","point":"偏序与盖覆关系"},"ca10":{"topic":"偏序与哈斯图","point":"哈斯图与特殊元素"},"c1":{"topic":"图论","point":"平面图与对偶图"},"c2":{"topic":"图论","point":"度序列"},"c10":{"topic":"图论","point":"通路计数"},"c12":{"topic":"图论","point":"欧拉图"},"c13":{"topic":"图论","point":"握手定理"},"c14":{"topic":"图论","point":"子图与同构"},"s10":{"topic":"图论","point":"完全图与欧拉图"},"s11":{"topic":"图论","point":"边连通度"},"s14":{"topic":"图论","point":"顶点与边的删除"},"ca7":{"topic":"图论","point":"握手定理"},"ca9":{"topic":"图论","point":"邻接矩阵与通路计数"}};
const topicQuestions=Object.entries(questionBank).flatMap(([type,qs])=>qs.map((q,i)=>({id:q.id,no:({choice:'选择',short:'简答',calc:'计算',proof:'论述'}[type])+(i+1),type,...topicMetadata[q.id]})));
function scrollTopicQuestion(id){const card=document.getElementById('topic-question-'+id);card?.scrollIntoView({block:'start',behavior:'smooth'});card?.focus({preventScroll:true});}
topicView=CaigouTopics.mount({container:document.getElementById('topic-host'),questions:topicQuestions,
onJump(index){const q=topicQuestions[index];if(!topicFilter?.includes(q.id))switchType(q.type);scrollTopicQuestion(q.id);},
onPractice(indices,name){topicFilter=indices.map(i=>topicQuestions[i].id);topicName=name;document.querySelectorAll('.type-tab').forEach(b=>b.classList.remove('active'));render();scrollTopicQuestion(topicFilter[0]);},
onReset(){topicFilter=null;switchType(currentType);document.getElementById('app').scrollIntoView({block:'start',behavior:'smooth'});}
});
</script>
